<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="imcContainer">
      <div id="inputDados">
        <h2>Calculadora de IMC</h2>
        <form id="formularioImc">
          <div class="dados">
            <div class="controleDados">
              <label for="Altura">Altura:</label>
              <input type="text"
               name="altura"
               id="altura" 
               placeholder="Ex: 1,70" 
               required
               >
            </div>
            <div class="controleDados">
              <label for="Peso">Peso:</label>
              <input 
                 type="text"
                 name="peso"
                 id="peso"
                 placeholder="Ex: 60,3" 
                 required
                >
              </div> 
            </div>
            <div class="acao">
              <button type="button" id="botaoCalcular">Calcular</button>
            </div>
          </form>
        </div>
        <div id="resultado" class="hide">
          <p id="imc">Seu IMC: <span></span></p>
          <p id="imcInfo">Situação: <span></span></p>
          <h3>Tabela de IMC</h3>
          <div id="tabelaImc">
            <div class="tabelaTexto">
              <h4>IMC</h4>
              <h4>Classificação</h4>
              <h4>Obesidade</h4>
            </div>
            <div id="linhasTabela"></div>
          </div>
          <button type="button" id="botaoVoltar">Voltar</button>
        </div>
      </div>  
    </div>
</body>
</html>
